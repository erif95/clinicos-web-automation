<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lindenhof Family Practice · Reception</title>
<style>
:root {
  --bg: #f4f6f8; --card: #ffffff; --ink: #1d2733; --muted: #5d6b7a; --line: #dde3e9;
  --accent: #0f766e; --accent-ink: #ffffff; --danger: #b42318; --danger-bg: #fef3f2;
  --ok: #067647; --ok-bg: #ecfdf3; --focus: #2563eb;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; }
header .sub { color: var(--muted); font-size: 13px; }
header .version { margin-left: auto; color: var(--muted); font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
main { max-width: 1120px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 380px 1fr; gap: 20px; align-items: start; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
.card h2 { font-size: 16px; margin: 0 0 14px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.field input, .field select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; color: inherit; }
.field input:focus, .field select:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.field.invalid input, .field.invalid select { border-color: var(--danger); }
.error { color: var(--danger); font-size: 12.5px; margin: 4px 0 0; min-height: 0; }
.error:empty { display: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button { font: inherit; cursor: pointer; }
.primary { width: 100%; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 10px; font-weight: 600; margin-top: 4px; }
.primary:hover { filter: brightness(1.08); }
.notice { margin: 0 0 14px; padding: 10px 12px; border-radius: 6px; font-size: 13.5px; }
.notice:empty { display: none; }
.notice.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid #abefc6; }
.notice.info { background: #eff8ff; color: #175cd3; border: 1px solid #b2ddff; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); border-bottom: 1px solid var(--line); padding: 8px 6px; }
td { border-bottom: 1px solid var(--line); padding: 9px 6px; vertical-align: middle; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cancel { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 13px; color: var(--danger); }
.cancel:hover { background: var(--danger-bg); }
.empty { color: var(--muted); font-size: 14px; padding: 10px 0 0; }
footer { max-width: 1120px; margin: 0 auto 32px; padding: 0 16px; color: var(--muted); font-size: 12.5px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
footer button { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; color: var(--muted); }
.whatsnew { font-size: 13px; color: var(--muted); margin: 0 0 14px; padding-left: 18px; }
</style>
</head>
<body>
<header>
  <h1>Lindenhof Family Practice</h1>
  <span class="sub">Reception · Appointments</span>
  <span class="version" data-testid="app-version">Version 1.0</span>
</header>
<main>
  <form class="card" id="booking-form" novalidate data-testid="booking-form" aria-labelledby="form-title">
    <h2 id="form-title">New appointment</h2>
    <div class="field">
      <label for="patient-name">Patient name</label>
      <input id="patient-name" name="name" autocomplete="off" data-testid="patient-name">
      <p class="error" id="error-name" data-testid="error-name" role="alert"></p>
    </div>
    <div class="row2">
      <div class="field">
        <label for="dob">Date of birth</label>
        <input id="dob" name="dob" type="date" data-testid="dob">
        <p class="error" id="error-dob" data-testid="error-dob" role="alert"></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="off" data-testid="email">
        <p class="error" id="error-email" data-testid="error-email" role="alert"></p>
      </div>
    </div>
    <div class="field">
      <label for="doctor">Doctor</label>
      <select id="doctor" name="doctor" data-testid="doctor"></select>
      <p class="error" id="error-doctor" data-testid="error-doctor" role="alert"></p>
    </div>
    <div class="field">
      <label for="reason">Reason for visit</label>
      <select id="reason" name="reason" data-testid="reason"></select>
      <p class="error" id="error-reason" data-testid="error-reason" role="alert"></p>
    </div>
    <div class="row2">
      <div class="field">
        <label for="date">Date</label>
        <input id="date" name="date" type="date" data-testid="date">
        <p class="error" id="error-date" data-testid="error-date" role="alert"></p>
      </div>
      <div class="field">
        <label for="time">Time</label>
        <select id="time" name="time" data-testid="time"></select>
        <p class="error" id="error-time" data-testid="error-time" role="alert"></p>
      </div>
    </div>
    <button class="primary" type="submit" data-testid="book-button">Book appointment</button>
  </form>

  <section class="card" aria-labelledby="list-title">
    <h2 id="list-title">Upcoming appointments</h2>
    
    <div class="notice" id="notice" role="status" data-testid="notice"></div>
    <table data-testid="appointments-table">
      <thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Reason</th><th aria-label="Actions"></th></tr></thead>
      <tbody id="appointments"></tbody>
    </table>
    <p class="empty" id="empty" data-testid="empty-state" hidden>No upcoming appointments.</p>
  </section>
</main>
<footer>
  <span>All times are practice time (Europe/Berlin). Demo data is stored in this browser only; all names are fictional.</span>
  <button type="button" id="reset" data-testid="reset-demo">Reset demo data</button>
</footer>

</body>
</html>
